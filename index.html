<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 增強響應式設計，適配行動裝置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>北歐奶茶風 - 互動式分層施工圖 (動線順暢定案版)</title>
    <style>
        /* ================= 系統變數定義 ================= */
        :root {
            /* 空間基底色系 */
            --bg-color: #fcfbf9;
            --wall-color: #5c5046;
            --wet-wall: #8c7f75;
            --floor-wood: #f8f4ef;
            --floor-tile: #f0ebe4;
            --orig-beam: #a09388;
            
            /* 軟裝家具色系 */
            --furn-wood: #e3d1be;
            --furn-wood-dark: #ccb7a1;
            --furn-sofa: #dfd5c9; 
            --furn-bed: #fdfcf9;
            --furn-wardrobe: #d9cabd;
            --furn-kitchen: #c5b5a6; /* 新增廚房變數 */
            --tv-screen: #222222;
            --tv-frame: #111111;

            /* 機電設備與管線色系 */
            --mep-beam: #f1c40f;
            --mep-ac: #3498db;
            --mep-fresh: #27ae60;
            --pipe-cold: #0984e3;
            --pipe-hot: #d63031;
            --pipe-drain: #00b894;
            --pipe-acd: #00cec9;
            --color-airflow: #8e44ad;
            --color-exhaust: #c0392b;

            /* 開關插座色系 */
            --elec-socket: #e74c3c;    
            --elec-switch: #f39c12;    
            --elec-network: #8e44ad;   
            --elec-water: #00cec9;     
            --elec-panel: #c0392b;     
            --elec-led: #f1c40f;       

            /* 天花板高度色系 */
            --ceil-28: #ffffff;
            --ceil-26: #d8c8b8;
            --ceil-24: #e3dcd5;
            
            /* UI 介面色系 */
            --primary: #8c7f75;
            --text-main: #332b24;
        }

        /* ================= 全域排版與基礎樣式 ================= */
        body {
            margin: 0; 
            padding: 20px; 
            background-color: #e5dfd8;
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .header { 
            text-align: center; 
            margin-bottom: 20px; 
            color: var(--text-main); 
        }
        
        .header h1 { 
            margin: 0 0 5px 0; 
            font-size: 26px; 
            letter-spacing: 2px; 
        }

        /* ================= 導覽分頁列 (Tabs) ================= */
        .tabs-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 15px; 
            width: 100%; 
            max-width: 1200px; 
        }
        
        .tab-btn { 
            background-color: #fff; 
            color: var(--primary); 
            border: 2px solid var(--primary); 
            /* 增加觸控範圍以優化行動裝置體驗 */
            padding: 10px 18px; 
            border-radius: 30px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .tab-btn:hover, .tab-btn:focus-visible { 
            background-color: #f4ede6; 
            outline: none;
            box-shadow: 0 0 0 3px rgba(140, 127, 117, 0.3);
        }
        
        .tab-btn.active { 
            background-color: var(--primary); 
            color: #fff; 
            box-shadow: 0 4px 10px rgba(140, 127, 117, 0.4); 
        }
        
        .tab-btn[data-layer="electrical"] { 
            border-color: var(--elec-socket); 
            color: var(--elec-socket); 
        }
        
        .tab-btn[data-layer="electrical"].active { 
            background-color: var(--elec-socket); 
            color: #fff; 
        }

        /* ================= 圖例與畫布容器 ================= */
        .legend-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 15px; 
            background: white; 
            padding: 15px 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            max-width: 1200px; 
            min-height: 24px; 
            transition: opacity 0.3s ease; 
        }
        
        .legend-item { display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #444; }
        .legend-box { width: 18px; height: 18px; margin-right: 8px; border-radius: 3px; border: 1px solid #ddd; }
        .legend-icon { width: 20px; height: 20px; margin-right: 8px; display: flex; justify-content: center; align-items: center; }

        .canvas-container { 
            background-color: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(180, 170, 160, 0.15); 
            width: 100%; 
            max-width: 1200px; 
            box-sizing: border-box; 
            overflow-x: auto;
            touch-action: pan-x pan-y; /* 優化觸控平移 */
        }
        
        svg { width: 100%; height: auto; display: block; }

        /* ================= SVG 樣式與動畫 ================= */
        .dim-text { font-size: 15px; font-weight: bold; fill: var(--orig-beam); text-anchor: middle; dominant-baseline: middle; }
        .leader-line { fill: none; stroke: #b0a092; stroke-width: 1.2; stroke-dasharray: 4, 4; opacity: 0.85; }
        .label-text { font-size: 13px; font-weight: bold; dominant-baseline: middle; }
        
        /* 替換原本的 JS 計時器，改用純 CSS 控制圖層的顯示與隱藏 */
        .svg-layer { 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none; 
            transition: opacity 0.4s ease, visibility 0.4s; 
        }
        
        .svg-layer.active { 
            opacity: 1; 
            visibility: visible; 
            pointer-events: auto; 
        }

        @keyframes dash { to { stroke-dashoffset: -20; } }
        .flow-line { stroke-dasharray: 8 6; animation: dash 1.5s linear infinite; }

        /* 綜合全圖模式 (全部圖層啟用，並透過 CSS 調整層級透明度) */
        .mode-all .svg-layer { opacity: 1; visibility: visible; pointer-events: auto; }
        .mode-all #layer-ceiling .ceil-zone { fill-opacity: 0.08; stroke-opacity: 0.2; }
        .mode-all #layer-mep .pipe-line { opacity: 0.25; }
        .mode-all #layer-mep .flow-line { opacity: 0.8; }
        .mode-all #layer-furniture { opacity: 0.65; }
        .mode-all #layer-masonry .orig-beam { opacity: 0.15; }
    </style>
</head>
<body>

    <header class="header">
        <h1>北歐奶茶風 互動式分層施工圖</h1>
        <p>🏆 最愛小豬豬！</p>
    </header>

    <!-- 導覽頁籤 (添加 ARIA 無障礙屬性) -->
    <nav class="tabs-container" id="tabs" role="tablist" aria-label="切換施工圖層">
        <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="master-svg" data-layer="all">綜合全圖</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-layer="masonry">① 泥作與隔間</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-layer="mep">② 水電空調與排煙 💨</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-layer="ceiling">③ 天花板地形</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-layer="cabinetry">④ 系統櫃 (內建行李櫃)</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-layer="furniture">⑤ 軟裝與家具</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-layer="electrical">⑥ 插座與線燈 ⚡</button>
    </nav>

    <!-- 圖例顯示區 (動態更新) -->
    <div class="legend-container" id="legend" aria-live="polite"></div>

    <main class="canvas-container">
        <!-- SVG 畫布區域 (壓縮路徑、加入工具提示) -->
        <svg viewBox="-200 -250 1600 1000" xmlns="http://www.w3.org/2000/svg" id="master-svg" class="mode-all" role="img" aria-label="室內設計配置圖">
            
            <defs>
                <!-- 箭頭標記壓縮 (共用路徑) -->
                <path id="arrow-path" d="M0,0 L9,3 L0,6 z" />
                <path id="arrow-path-start" d="M9,0 L0,3 L9,6 z" />
                
                <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto"><use href="#arrow-path-start" fill="#b0a092" /></marker>
                <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><use href="#arrow-path" fill="#b0a092" /></marker>
                <marker id="arrow-drain" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--pipe-drain)" /></marker>
                <marker id="arrow-ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><use href="#arrow-path" fill="var(--mep-ac)" /></marker>
                <marker id="arrow-fresh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><use href="#arrow-path" fill="var(--mep-fresh)" /></marker>
                <marker id="arrow-flow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><use href="#arrow-path" fill="var(--color-airflow)" /></marker>
                <marker id="arrow-exhaust" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><use href="#arrow-path" fill="var(--color-exhaust)" /></marker>

                <!-- 背景紋理 -->
                <pattern id="wood-floor" width="40" height="120" patternUnits="userSpaceOnUse"><rect width="40" height="120" fill="var(--floor-wood)"/><path d="M0,0 L0,120 M0,60 L40,60" stroke="#ede5db" fill="none"/></pattern>
                <pattern id="tile-floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="var(--floor-tile)"/><rect width="40" height="40" fill="none" stroke="#e0d7cd"/></pattern>
                <pattern id="concrete-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--wet-wall)" /><circle cx="3" cy="3" r="1" fill="#a09388" /></pattern>
                <pattern id="orig-beam-pattern" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="20" height="20" fill="none"/><line x1="0" y1="0" x2="0" y2="20" stroke="var(--orig-beam)" stroke-width="2" opacity="0.4"/></pattern>
                
                <linearGradient id="tv-glare" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#333"/><stop offset="50%" stop-color="#2a2a2a"/><stop offset="100%" stop-color="#222"/></linearGradient>
                <linearGradient id="water-heater" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e0e0e0"/></linearGradient>
                <linearGradient id="glass-door" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="rgba(255,255,255,0.2)"/><stop offset="50%" stop-color="rgba(255,255,255,0.6)"/><stop offset="100%" stop-color="rgba(255,255,255,0.2)"/></linearGradient>

                <!-- 電氣與設備符號 -->
                <g id="sym-recessed"><circle cx="0" cy="0" r="8" fill="#fff" stroke="#e67e22" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="#e67e22"/></g>
                <g id="sym-ceiling"><circle cx="0" cy="0" r="25" fill="rgba(52, 152, 219, 0.1)" stroke="var(--mep-ac)" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="var(--mep-ac)"/></g>
                <g id="sym-socket"><rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--elec-socket)" stroke="#fff" stroke-width="1"/><path d="M-2,-2 L-2,2 M2,-2 L2,2" stroke="#fff" stroke-width="1.5" fill="none"/></g>
                <g id="sym-switch"><circle cx="0" cy="0" r="7" fill="var(--elec-switch)" stroke="#fff" stroke-width="1.5"/><circle cx="0" cy="0" r="2" fill="#fff"/></g>
                <g id="sym-network"><polygon points="0,-7 7,5 -7,5" fill="var(--elec-network)" stroke="#fff" stroke-width="1"/></g>
                <g id="sym-water"><path d="M0,-6 Q5,0 5,4 A5,5 0 0 1 -5,4 Q-5,0 0,-6 Z" fill="var(--elec-water)" stroke="#fff" stroke-width="1"/></g>
                <g id="sym-camera"><rect x="-7" y="-5" width="14" height="10" rx="2" fill="var(--elec-network)" stroke="#fff" stroke-width="1"/><circle cx="0" cy="0" r="3" fill="#fff" /></g>
                <g id="sym-panel"><rect x="-8" y="-12" width="16" height="24" fill="#fff" stroke="var(--elec-panel)" stroke-width="2" rx="1"/><path d="M-8,-12 L8,12 M8,-12 L-8,12" stroke="var(--elec-panel)" stroke-width="1.5" fill="none"/></g>
                <g id="sym-heater"><rect x="-10" y="-10" width="20" height="20" fill="none" stroke="var(--elec-socket)" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="var(--elec-socket)"/><path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="var(--elec-socket)" stroke-width="1.5" fill="none"/></g>
            </defs>

            <!-- ================= 固定底層 (全域常駐) ================= -->
            <g id="layer-base">
                <polygon points="0,40 40,0 94,0 94,400 40,400 0,360" fill="#d1cfcb" />
                <rect x="94" y="0" width="786" height="400" fill="url(#wood-floor)" />
                <rect x="880" y="0" width="230" height="400" fill="url(#tile-floor)" />

                <!-- 尺寸標示線 -->
                <g stroke="#b0a092" stroke-width="2">
                    <path d="M 94,-40 L 394,-40 M 394,-40 L 880,-40 M 880,-40 L 1110,-40 M 94,440 L 1110,440" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
                    <text x="244" y="-50" class="dim-text" stroke="none">3m</text>
                    <text x="637" y="-50" class="dim-text" stroke="none">4.86m</text>
                    <text x="995" y="-50" class="dim-text" stroke="none">2.3m</text>
                    <text x="602" y="430" class="dim-text" stroke="none">室內總長 10.16m</text>
                    <!-- 尺寸輔助短線 -->
                    <path d="M 94,-50 L 94,0 M 394,-50 L 394,0 M 880,-50 L 880,0 M 1110,-50 L 1110,0 M 94,400 L 94,450 M 1110,400 L 1110,450" stroke-width="1" />
                </g>
            </g>

            <!-- ================= ① 泥作與結構層 ================= -->
            <g id="layer-masonry" class="svg-layer active">
                <g fill="var(--wall-color)">
                    <!-- 陽台氣密落地玻璃拉門 -->
                    <path d="M90,0 h4 v20 h-4 z M90,250 h4 v150 h-4 z" />
                    <rect x="88" y="20" width="8" height="230" fill="#e0e0e0" />
                    <rect x="88" y="20" width="4" height="115" fill="url(#glass-door)" stroke="#b0a092" stroke-width="1" />
                    <rect x="92" y="135" width="4" height="115" fill="url(#glass-door)" stroke="#b0a092" stroke-width="1" />

                    <!-- 長虹玻璃連動拉門 -->
                    <rect x="392" y="0" width="6" height="400" fill="#e0e0e0" /> 
                    <rect x="390" y="0" width="4" height="130" fill="url(#glass-door)" stroke="#b0a092" stroke-width="1" />
                    <rect x="394" y="125" width="4" height="130" fill="url(#glass-door)" stroke="#b0a092" stroke-width="1" />
                    
                    <!-- 實體隔間牆 -->
                    <path d="M878,0 h4 v80 h-4 z M878,150 h4 v250 h-4 z M94,-4 h1020 v4 h-1020 z M94,400 h926 v4 h-926 z M1110,0 h4 v310 h-4 z" />
                </g>
                <rect x="94" y="350" width="1016" height="50" fill="url(#orig-beam-pattern)" class="orig-beam" />
                <line x1="94" y1="350" x2="1110" y2="350" stroke="var(--orig-beam)" stroke-width="2" stroke-dasharray="8,4" class="orig-beam" />

                <!-- 15cm 灌漿牆 -->
                <rect x="882" y="150" width="228" height="15" fill="url(#concrete-pattern)" stroke="var(--wall-color)" stroke-width="1.5" />
                
                <!-- 浴室半高矮牆+玻璃 (無淋浴玻璃門) -->
                <rect x="1030" y="0" width="80" height="150" fill="rgba(240, 243, 245, 0.5)" />
                <rect x="1024" y="0" width="12" height="100" fill="#f0ebe4" stroke="#c4bdb6" stroke-width="2" rx="2" />
                <rect x="1028" y="0" width="4" height="100" fill="url(#glass-door)" stroke="var(--mep-ac)" stroke-width="1" opacity="0.8" />
                
                <!-- 懸吊拉門 -->
                <rect x="882" y="76" width="70" height="4" fill="#a09388" />
                <path d="M 882 78 L 860 78" stroke="#a09388" stroke-width="2" marker-start="url(#arrow-start)" fill="none"/>
                
                <!-- 大門開啟軌跡 -->
                <g fill="none" stroke="#bea99a" stroke-width="2">
                    <path d="M 1020 400 A 90 90 0 0 1 1110 310" stroke-dasharray="5,5" />
                    <line x1="1110" y1="400" x2="1110" y2="310" stroke-width="4" stroke-linecap="round" />
                </g>
            </g>

            <!-- ================= ② 水電空調與排氣層 ================= -->
            <g id="layer-mep" class="svg-layer active">
                <rect x="1060" y="0" width="50" height="40" fill="#636e72" />
                <rect x="910" y="20" width="90" height="45" fill="url(#water-heater)" stroke="var(--pipe-hot)" stroke-width="2" rx="4" />
                <line x1="910" y1="42.5" x2="1000" y2="42.5" stroke="#ccc" stroke-width="1" />
                <circle cx="985" cy="30" r="4" fill="var(--pipe-hot)" />
                <circle cx="985" cy="55" r="4" fill="var(--pipe-cold)" />

                <!-- 合併水電管線路徑 -->
                <g class="pipe-line" fill="none" stroke-linejoin="round">
                    <path d="M 905 30 L 1060 30 M 920 180 L 1080 180 L 1080 40" stroke="var(--pipe-drain)" stroke-width="4" marker-end="url(#arrow-drain)" />
                    <path d="M 1060 15 L 1030 15 L 1030 55 L 985 55 M 1030 15 L 1030 180 L 940 180" stroke="var(--pipe-cold)" stroke-width="2" />
                    <path d="M 1030 180 L 1030 380 L 50 380 L 50 315" stroke="var(--pipe-cold)" stroke-width="2" stroke-dasharray="8 4" />
                    <path d="M 985 30 L 1045 30 L 1045 170 L 920 170" stroke="var(--pipe-hot)" stroke-width="2" />
                    <path d="M 47 380 L 94 340 L 880 340 L 1060 40" stroke="var(--pipe-acd)" stroke-width="3" stroke-dasharray="6,4" />
                </g>
                
                <!-- 空調設備與管線 -->
                <rect x="15" y="190" width="60" height="70" fill="rgba(52, 152, 219, 0.2)" stroke="var(--mep-ac)" stroke-width="2" stroke-dasharray="4,2" rx="3" />
                <rect x="180" y="340" width="90" height="20" fill="rgba(52, 152, 219, 0.4)" stroke="var(--mep-ac)" stroke-width="2" rx="2" />
                <rect x="490" y="340" width="90" height="20" fill="rgba(52, 152, 219, 0.4)" stroke="var(--mep-ac)" stroke-width="2" rx="2" />
                <rect x="15" y="330" width="60" height="40" fill="rgba(39, 174, 96, 0.2)" stroke="var(--mep-fresh)" stroke-width="2" stroke-dasharray="4,2" rx="3" />
                
                <!-- 新風機管線合併 -->
                <path d="M 75 350 L 550 350" stroke="var(--mep-fresh)" stroke-width="5" fill="none" opacity="0.6" />
                <g fill="none" marker-end="url(#arrow-ac)" opacity="0.7">
                    <path d="M 225 330 L 225 250" stroke="var(--mep-ac)" stroke-width="2" stroke-dasharray="5 3" />
                    <path d="M 535 330 Q 535 150 700 150" stroke="var(--mep-ac)" stroke-width="2" stroke-dasharray="10 5" />
                </g>

                <rect x="295" y="347" width="40" height="6" fill="#fff" stroke="var(--mep-fresh)" stroke-width="1" />
                <rect x="400" y="347" width="40" height="6" fill="#fff" stroke="var(--mep-fresh)" stroke-width="1" />
                <path d="M 315 340 L 315 300 M 420 340 L 420 300" stroke="var(--mep-fresh)" stroke-width="2" fill="none" marker-end="url(#arrow-fresh)" />

                <!-- 排氣設備合併 -->
                <g fill="var(--color-exhaust)">
                    <rect x="965" y="55" width="30" height="30" rx="4" />
                    <rect x="1040" y="155" width="60" height="30" rx="2" />
                </g>
                <path d="M 995 70 L 1125 70 M 1070 155 L 1070 125 L 1125 125" stroke="var(--color-exhaust)" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arrow-exhaust)" />

                <!-- 全室正壓換氣動線 -->
                <g stroke="var(--color-airflow)" stroke-width="2.5" fill="none" opacity="0.8" class="flow-line">
                    <path d="M 315 280 Q 330 180 380 180" marker-end="url(#arrow-flow)" />
                    <path d="M 420 280 Q 450 180 600 180" marker-end="url(#arrow-flow)" />
                    <path d="M 600 180 Q 750 200 850 200" marker-end="url(#arrow-flow)" />
                    <path d="M 850 200 Q 950 180 1020 180" marker-end="url(#arrow-flow)" />
                    <path d="M 850 100 Q 880 120 920 120" marker-end="url(#arrow-flow)" />
                </g>
            </g>

            <!-- ================= ③ 天花板與照明層 ================= -->
            <g id="layer-ceiling" class="svg-layer active">
                <rect x="94" y="0" width="786" height="320" fill="var(--ceil-28)" stroke="#e0e0e0" stroke-width="1" class="ceil-zone" opacity="0.8"/>
                <rect x="880" y="0" width="230" height="400" fill="url(#hatch-24)" stroke="#b8b0a6" stroke-width="2" class="ceil-zone" opacity="0.8"/>
                <rect x="94" y="320" width="786" height="80" fill="var(--ceil-26)" stroke="#cbbab5" stroke-width="2" class="ceil-zone" opacity="0.9"/>
                
                <!-- 照明燈具 (支援滑鼠懸停 tooltip 提示) -->
                <use href="#sym-ceiling" x="244" y="160"><title>主吸頂燈 (客廳)</title></use>

            const targetBtn = e.target.closest('.tab-btn');
            if(!targetBtn) return;

            // 1. 更新按鈕狀態與無障礙標籤 (A11y)
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            targetBtn.classList.add('active');
            targetBtn.setAttribute('aria-selected', 'true');

            const selectedLayer = targetBtn.getAttribute('data-layer');

            // 2. 透過 CSS Class 切換圖層狀態，不再依賴 JavaScript setTimeout 控制渲染
            if(selectedLayer === 'all') {
                svgElement.classList.add('mode-all');
                allLayers.forEach(el => el.classList.add('active'));
            } else {
                svgElement.classList.remove('mode-all');
                allLayers.forEach(el => {
                    if (el.id === 'layer-' + selectedLayer || el.id === 'layer-base') {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });
            }

            // 3. 更新圖例
            updateLegend(selectedLayer);
        });

        // 柔性更新圖例內容
        function updateLegend(mode) {
            legendContainer.style.opacity = '0';
            setTimeout(() => {
                legendContainer.innerHTML = legends[mode] || '';
                legendContainer.style.opacity = '1';
            }, 200); // 配合 CSS transition
        }
    </script>
</body>
